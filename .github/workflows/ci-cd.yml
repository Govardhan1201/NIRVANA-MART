name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check (Backend)
        run: node -c server.js

      # You can add more testing steps here later (e.g., npm test)

  deploy:
    name: Deploy to Render
    needs: build-and-check
    runs-on: ubuntu-latest
    # Only run deployment on pushes to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️ RENDER_DEPLOY_HOOK_URL secret is missing!"
            echo "Since you might be using Render's built-in Auto-Deploy, this step can be skipped."
            echo "If you disabled Auto-Deploy on Render and want GitHub Actions to trigger it:"
            echo "1. Get your Deploy Hook URL from the Render Dashboard (Settings -> Deploy Hook)."
            echo "2. Add it as a GitHub Repository Secret named RENDER_DEPLOY_HOOK_URL."
          else
            echo "🚀 Triggering deployment on Render..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo -e "\n✅ Deployment triggered successfully!"
          fi
