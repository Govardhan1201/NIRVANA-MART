<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>
      body { margin: 0; overflow: hidden; background: transparent; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { CART_POS_DATA as POS_DATA } from './shared/js/cart-data.js';

        // CONFIG
        const COUNT = 50000;
        const SPEED_MULT = 1.5;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        // scene.fog = new THREE.FogExp2(0x000000, 0.01); // Removed for transparency
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        // Offset camera projection only on desktop (where it's a 2-column layout)
        if (window.innerWidth > 1024) {
            camera.setViewOffset(window.innerWidth, window.innerHeight, -window.innerWidth * 0.25, 0, window.innerWidth, window.innerHeight);
        }
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true });
        renderer.setClearColor(0x000000, 0); // Full transparent
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.ConeGeometry(0.1, 0.5, 4).rotateX(Math.PI / 2);
        const material = new THREE.MeshBasicMaterial({ color: 0xc8923a });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3(POS_DATA[i*3], POS_DATA[i*3+1], POS_DATA[i*3+2]));
            instancedMesh.setColorAt(i, color.setHex(0xc8923a));
        }

        // CONTROL STUBS
        const PARAMS = {};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            if (window.innerWidth > 1024) {
                camera.setViewOffset(window.innerWidth, window.innerHeight, -window.innerWidth * 0.25, 0, window.innerWidth, window.innerHeight);
            } else {
                camera.clearViewOffset();
            }
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ─── EXPLODE / Reassemble on postMessage ──────────────────────
        let explodeMode = false;
        let explodeVelocities = [];
        let originalPositions = [];
        let disruptPositions = [];
        let explodeT = 0;

        // Store original target positions after first frame
        setTimeout(() => {
          for (let i = 0; i < COUNT; i++) {
            originalPositions[i] = positions[i].clone();
            explodeVelocities[i] = new THREE.Vector3(
              (Math.random() - 0.5) * 6,
              (Math.random() - 0.5) * 6,
              (Math.random() - 0.5) * 6
            );
          }
        }, 2000);

        // NATIVE MOUSE FORWARDING TO PARENT FOR CUSTOM CURSOR
        window.addEventListener('mousemove', (e) => {
            window.parent.postMessage({ type: 'IFRAME_MOUSEMOVE', clientX: e.clientX, clientY: e.clientY }, '*');
        });
        window.addEventListener('mousedown', () => {
            window.parent.postMessage({ type: 'IFRAME_MOUSEDOWN' }, '*');
        });
        window.addEventListener('mouseup', () => {
            window.parent.postMessage({ type: 'IFRAME_MOUSEUP' }, '*');
        });

        // NATIVE CLICK TO EXPLODE
        let lastDown = 0;
        let isAnimatingExplode = false;
        window.addEventListener('mousedown', () => { lastDown = Date.now(); });
        window.addEventListener('click', (e) => {
            if (Date.now() - lastDown > 200) return; // Prevent drag clicks
            if (isAnimatingExplode) return; // Prevent spamming clicks

            explodeMode = true;
            isAnimatingExplode = true;
            explodeT = 0;
            const shapeType = Math.floor(Math.random() * 3);
            
            // Scatter into shapes
            for (let i = 0; i < COUNT; i++) {
              if (!disruptPositions[i]) disruptPositions[i] = new THREE.Vector3();
              
              if (shapeType === 0) {
                  // Sphere
                  const u = Math.random();
                  const v = Math.random();
                  const theta = u * 2.0 * Math.PI;
                  const phi = Math.acos(2.0 * v - 1.0);
                  const r = 45 + Math.random() * 15;
                  disruptPositions[i].set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
              } else if (shapeType === 1) {
                  // Torus
                  const u = Math.random() * Math.PI * 2;
                  const v = Math.random() * Math.PI * 2;
                  const R = 35;
                  const r2 = 12 + Math.random() * 6;
                  disruptPositions[i].set((R + r2 * Math.cos(v)) * Math.cos(u), (R + r2 * Math.cos(v)) * Math.sin(u), r2 * Math.sin(v));
              } else {
                  // Helix / Tornado
                  const t = Math.random() * Math.PI * 12;
                  const r3 = 25;
                  const offset = (Math.random() - 0.5) * 8;
                  const y = (t * 5) - 90 + offset;
                  disruptPositions[i].set(r3 * Math.cos(t) + offset, y, r3 * Math.sin(t) + offset);
              }
            }
            
            // Auto reassemble after 2.5s disruption
            setTimeout(() => {
              explodeMode = false;
              let progress = 0;
              const interval = setInterval(() => {
                progress += 0.03;
                for (let i = 0; i < COUNT; i++) {
                  positions[i].lerp(originalPositions[i], 0.06);
                }
                if (progress >= 1) {
                  for (let i = 0; i < COUNT; i++) {
                    positions[i].copy(originalPositions[i]);
                  }
                  clearInterval(interval);
                  isAnimatingExplode = false; // Allow next click
                }
              }, 16);
            }, 2500);
        });

        // In animate loop, apply explode physics
        const origAnimate = animate;
        function animateWrapped() {
          requestAnimationFrame(animateWrapped);
          const delta2 = clock.getDelta();
          if (material.uniforms && material.uniforms.uTime) material.uniforms.uTime.value = clock.getElapsedTime() * SPEED_MULT;
          controls.update();
          if (explodeMode) {
            for (let i = 0; i < COUNT; i++) {
              positions[i].lerp(disruptPositions[i], 0.06);
            }
          }
          for (let i = 0; i < COUNT; i++) {
            dummy.position.copy(positions[i]);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
          }
          instancedMesh.instanceMatrix.needsUpdate = true;
          renderer.render(scene, camera);
        }
        animateWrapped(); // Start the main render + physics loop
    </script>
</body>
</html>
